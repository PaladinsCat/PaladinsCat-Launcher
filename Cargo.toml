[package]
name = "paladinscat-launcher"
version = "0.3.2"
edition = "2024"
default-run = "paladinscat-launcher"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/PaladinsCat/PaladinsCat-Launcher"
description = "PaladinsCat Launcher"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "=0.36.2"
pollster = "0.4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "=0.1.31"

[[bin]]
name = "patcher-assets"
path = "src/assets.rs"

[[bin]]
name = "paladinscat-release"
path = "src/release.rs"

[[bin]]
name = "launcher-budget"
path = "src/budget.rs"

[[bin]]
name = "paladinscat-launcher-cli"
path = "src/bin/launcher_cli.rs"
