[package]
name = "paladinscat-launcher"
version = "0.3.9"
edition = "2024"
default-run = "paladinscat-launcher"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/PaladinsCat/PaladinsCat-Launcher"
description = "PaladinsCat Launcher"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "glow"] }
egui = "=0.36.2"
pollster = "0.4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "=0.1.31"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }
windows = { version = "=0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole"] }

[[bin]]
name = "patcher-assets"
path = "src/assets.rs"

[[bin]]
name = "paladinscat-release"
path = "src/release.rs"

[[bin]]
name = "launcher-budget"
path = "src/budget.rs"

[[bin]]
name = "paladinscat-launcher-cli"
path = "src/bin/launcher_cli.rs"
